<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5b21b6">
<title>Quiz Brevet 3e</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --violet:#6d28d9; --violet-dark:#4c1d95; --rose:#ec4899; --orange:#f59e0b;
    --vert:#10b981; --rouge:#ef4444; --bleu:#3b82f6; --jaune:#fde047;
    --ink:#1e1b4b; --paper:#fdfcff; --shadow:rgba(76,29,149,.25);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Nunito',sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#7c3aed 0%,#6d28d9 35%,#9333ea 70%,#c026d3 100%);
    background-attachment:fixed; min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px);
    overflow-x:hidden;
  }
  .bubble{position:fixed;border-radius:50%;opacity:.12;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 30% 30%,#fff,transparent 70%)}
  .b1{width:220px;height:220px;top:-60px;left:-50px}
  .b2{width:160px;height:160px;bottom:8%;right:-40px}
  .b3{width:120px;height:120px;top:40%;left:-30px}
  .app{width:100%;max-width:560px;position:relative;z-index:1;margin-top:18px}
  .card{
    background:var(--paper); border-radius:28px; padding:26px 22px;
    box-shadow:0 18px 50px var(--shadow),0 4px 0 rgba(0,0,0,.04);
    position:relative; overflow:hidden;
  }
  .card::before{content:"";position:absolute;inset:0;height:8px;
    background:linear-gradient(90deg,var(--rose),var(--orange),var(--jaune),var(--vert),var(--bleu),var(--violet))}
  h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:2.1rem;line-height:1.05;
    color:var(--violet-dark);letter-spacing:-.5px;margin-top:8px}
  .sub{font-weight:700;color:var(--rose);font-size:1rem;margin-top:6px;letter-spacing:.5px;text-transform:uppercase}
  .lead{margin:16px 0 4px;font-size:1.02rem;color:#4b5563;font-weight:600;line-height:1.5}
  .logo{display:inline-flex;align-items:center;gap:8px;background:var(--jaune);
    color:var(--violet-dark);font-family:'Fredoka',sans-serif;font-weight:700;
    padding:7px 16px;border-radius:999px;font-size:.95rem;
    box-shadow:0 4px 0 #d4b106;transform:rotate(-2deg)}
  .section-title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.05rem;
    color:var(--violet-dark);margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between}
  .section-title .mini{font-family:'Nunito';font-weight:800;font-size:.72rem;color:#a78bda;text-transform:uppercase}
  /* compte à rebours */
  .countdowns{display:flex;flex-direction:column;gap:8px}
  .cd{display:flex;align-items:center;gap:12px;background:#f7f3ff;border-radius:16px;padding:11px 14px;border-left:5px solid var(--violet)}
  .cd .emo{font-size:1.4rem;flex:0 0 auto}
  .cd .info{flex:1;line-height:1.15}
  .cd .nm{font-weight:800;font-size:.95rem;color:var(--violet-dark)}
  .cd .dt{font-size:.74rem;font-weight:700;color:#9b8ac4}
  .cd .days{font-family:'Fredoka';font-weight:700;font-size:1.05rem;color:#fff;background:var(--rose);
    border-radius:12px;padding:6px 12px;text-align:center;min-width:64px;line-height:1}
  .cd .days small{display:block;font-size:.6rem;font-weight:700;opacity:.85;margin-top:2px}
  .cd.hist{border-color:#2563eb}.cd.hist .days{background:#2563eb}
  .cd.fr{border-color:#db2777}.cd.fr .days{background:#db2777}
  .cd.sci{border-color:#d97706}.cd.sci .days{background:#d97706}
  .cd.math{border-color:#059669}.cd.math .days{background:#059669}
  .cd.done .days{background:#9ca3af}
  .subjects{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .subj{
    border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;
    font-size:.98rem;color:#fff;padding:16px 12px;border-radius:18px;
    display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
    transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
    position:relative;line-height:1.1;
  }
  .subj .emo{font-size:1.7rem}
  .subj .cnt{font-size:.72rem;font-weight:700;opacity:.9}
  .subj:active{transform:scale(.95)}
  .subj.off{filter:grayscale(.7) brightness(.92);opacity:.55}
  .subj .check{position:absolute;top:8px;right:10px;font-size:1rem;opacity:0;transition:.15s}
  .subj:not(.off) .check{opacity:1}
  .c-hist{background:linear-gradient(150deg,#3b82f6,#1d4ed8);box-shadow:0 6px 0 #1e40af}
  .c-fr{background:linear-gradient(150deg,#ec4899,#be185d);box-shadow:0 6px 0 #9d174d}
  .c-math{background:linear-gradient(150deg,#10b981,#059669);box-shadow:0 6px 0 #047857}
  .c-sci{background:linear-gradient(150deg,#f59e0b,#d97706);box-shadow:0 6px 0 #b45309}
  .seg{display:flex;background:#f1eafe;border-radius:14px;padding:4px}
  .seg button{flex:1;border:none;background:transparent;font-family:'Nunito';font-weight:800;
    font-size:.9rem;color:#7c3aed;padding:9px 4px;border-radius:10px;cursor:pointer;transition:.15s}
  .seg button.active{background:var(--violet);color:#fff;box-shadow:0 3px 8px var(--shadow)}
  .btn{
    width:100%;border:none;cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;
    font-size:1.25rem;color:#fff;padding:18px;border-radius:20px;margin-top:22px;
    background:linear-gradient(150deg,var(--rose),#db2777);
    box-shadow:0 7px 0 #9d174d,0 12px 24px rgba(219,39,119,.35);
    transition:transform .12s ease,box-shadow .12s ease;letter-spacing:.3px;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 3px 0 #9d174d,0 6px 14px rgba(219,39,119,.3)}
  .btn.green{background:linear-gradient(150deg,var(--vert),#059669);box-shadow:0 7px 0 #047857,0 12px 24px rgba(5,150,105,.3)}
  .btn.ghost{background:#f1eafe;color:var(--violet);box-shadow:0 5px 0 #d8c7f5}
  .btn.small{font-size:1rem;padding:13px;margin-top:12px}
  .hint{text-align:center;font-size:.82rem;color:#9ca3af;font-weight:700;margin-top:14px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
  .pill{font-family:'Fredoka';font-weight:600;background:#f1eafe;color:var(--violet);
    padding:6px 14px;border-radius:999px;font-size:.9rem;white-space:nowrap}
  .pill.score{background:var(--jaune);color:var(--violet-dark);box-shadow:0 3px 0 #d4b106}
  .tagsubj{font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;
    padding:5px 10px;border-radius:999px;color:#fff;white-space:nowrap}
  /* minuteur */
  .timerbar{height:10px;background:#eee6fb;border-radius:999px;overflow:hidden;margin:12px 0 4px}
  .timerbar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#10b981,#f59e0b);width:100%;transition:width 1s linear}
  .timerbar.warn>i{background:linear-gradient(90deg,#f59e0b,#ef4444)!important}
  .timerbar.crit>i{background:var(--rouge)!important}
  .timetxt{text-align:right;font-family:'Fredoka';font-weight:600;font-size:.8rem;color:#9ca3af;margin-bottom:8px}
  .timetxt b{color:var(--rouge)}
  .progress{height:12px;background:#eee6fb;border-radius:999px;overflow:hidden;margin:6px 0}
  .progress>i{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--rose),var(--orange),var(--vert));width:0;transition:width .4s cubic-bezier(.4,1.3,.6,1)}
  .qcount{font-size:.8rem;font-weight:800;color:#9ca3af;margin-bottom:6px}
  .question{font-family:'Fredoka',sans-serif;font-weight:500;font-size:1.4rem;line-height:1.25;
    color:var(--ink);margin:6px 0 18px}
  .answers{display:flex;flex-direction:column;gap:12px}
  .ans{
    border:3px solid #ede9fe;background:#faf8ff;cursor:pointer;text-align:left;
    font-family:'Nunito';font-weight:700;font-size:1.04rem;color:var(--ink);
    padding:16px 18px;border-radius:18px;transition:transform .1s,border-color .15s,background .15s;
    display:flex;align-items:center;gap:12px;
  }
  .ans .key{flex:0 0 30px;height:30px;border-radius:9px;background:#ede9fe;color:var(--violet);
    display:grid;place-items:center;font-family:'Fredoka';font-weight:600;font-size:1rem}
  .ans:active{transform:scale(.98)}
  .ans.correct{border-color:var(--vert);background:#e7f9f1}
  .ans.correct .key{background:var(--vert);color:#fff}
  .ans.wrong{border-color:var(--rouge);background:#fdeaea}
  .ans.wrong .key{background:var(--rouge);color:#fff}
  .ans.dim{opacity:.5}.ans.locked{cursor:default}
  .explain{margin-top:18px;background:#f5f0ff;border-left:5px solid var(--violet);
    border-radius:12px;padding:14px 16px;font-size:.96rem;font-weight:600;color:#4b3a78;line-height:1.45;display:none}
  .explain.show{display:block;animation:pop .3s ease}
  .explain b{color:var(--violet-dark)}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .next{margin-top:16px;display:none}.next.show{display:block}
  .result{text-align:center}
  .medal{font-size:4.5rem;margin:6px 0;animation:bounce .6s ease}
  @keyframes bounce{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  .bigscore{font-family:'Fredoka';font-weight:700;font-size:3.4rem;color:var(--violet-dark);line-height:1}
  .bigscore small{font-size:1.4rem;color:#9ca3af}
  .verdict{font-family:'Fredoka';font-weight:500;font-size:1.3rem;color:var(--rose);margin:8px 0 4px}
  .statline{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .stat{background:#f5f0ff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:.85rem;color:var(--violet-dark)}
  .stat span{display:block;font-size:1.2rem;font-family:'Fredoka';font-weight:700;color:var(--violet)}
  /* saisie pseudo */
  .pseudo{margin-top:18px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .pseudo label{font-weight:800;font-size:.9rem;color:var(--violet-dark);text-align:center}
  .pseudo input{font-family:'Nunito';font-weight:800;font-size:1.1rem;text-align:center;
    padding:14px;border-radius:16px;border:3px solid #ede9fe;background:#faf8ff;color:var(--ink);outline:none}
  .pseudo input:focus{border-color:var(--violet)}
  .savedmsg{text-align:center;font-weight:800;color:var(--vert);margin-top:10px;font-size:.92rem}
  /* classement */
  .lb{margin-top:16px;display:flex;flex-direction:column;gap:7px;max-height:300px;overflow-y:auto;padding-right:4px}
  .lbrow{display:flex;align-items:center;gap:10px;background:#faf8ff;border-radius:12px;padding:9px 12px;font-weight:700}
  .lbrow .rk{font-family:'Fredoka';font-weight:700;color:#a78bda;width:26px;text-align:center;flex:0 0 auto}
  .lbrow .nm{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lbrow .pts{font-family:'Fredoka';font-weight:700;color:var(--violet)}
  .lbrow .tm{font-size:.72rem;color:#9ca3af;font-weight:700;flex:0 0 auto;width:48px;text-align:right}
  .lbrow.top1{background:linear-gradient(120deg,#fef9c3,#fde68a);border-left:4px solid var(--jaune)}
  .lbrow.top2{background:#f1f5f9;border-left:4px solid #cbd5e1}
  .lbrow.top3{background:#fef3e2;border-left:4px solid #fdba74}
  .lbrow.me{outline:3px solid var(--rose);outline-offset:-1px}
  .lbrow.me .nm{color:var(--rose)}
  .lbempty{text-align:center;color:#9ca3af;font-weight:700;padding:18px;font-size:.9rem}
  .lbscope{text-align:center;font-size:.72rem;font-weight:800;color:#a78bda;margin-top:8px;text-transform:uppercase;letter-spacing:.4px}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .hide{display:none!important}
  .confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:50;border-radius:2px;pointer-events:none}
  @media(min-width:600px){h1{font-size:2.4rem}}
</style>
</head>
<body>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
<div class="app">
  <section id="home" class="card fade">
    <span class="logo">🎓 Brevet 3e</span>
    <h1>Quiz du Brevet</h1>
    <div class="sub">400 questions pour réviser</div>
    <div class="section-title">⏳ J avant les épreuves <span class="mini" id="cdYear"></span></div>
    <div class="countdowns" id="countdowns"></div>
    <div class="section-title">📚 Matières</div>
    <div class="subjects" id="subjects">
      <button class="subj c-hist" data-key="hist"><span class="check">✓</span><span class="emo">🏛️</span>Histoire-Géo-EMC<span class="cnt"></span></button>
      <button class="subj c-fr"   data-key="fr"><span class="check">✓</span><span class="emo">📖</span>Français<span class="cnt"></span></button>
      <button class="subj c-math" data-key="math"><span class="check">✓</span><span class="emo">📐</span>Mathématiques<span class="cnt"></span></button>
      <button class="subj c-sci"  data-key="sci"><span class="check">✓</span><span class="emo">🔬</span>Sciences<span class="cnt"></span></button>
    </div>
    <div class="section-title">🎯 Nombre de questions</div>
    <div class="seg" id="lenSeg">
      <button data-len="10" class="active">10</button>
      <button data-len="20">20</button>
      <button data-len="40">40</button>
      <button data-len="0">Max</button>
    </div>
    <button class="btn" id="startBtn">▶ Commencer</button>
    <button class="btn ghost small" id="seeLbBtn">🏆 Voir le classement</button>
    <p class="hint">Astuce iPhone : Partager → « Sur l'écran d'accueil » 📲</p>
  </section>

  <section id="game" class="card hide">
    <div class="topbar">
      <span class="pill" id="qIndex">1 / 10</span>
      <span class="tagsubj" id="qSubject">Matière</span>
      <span class="pill score" id="scorePill">⭐ 0</span>
    </div>
    <div class="timerbar" id="timerbar"><i id="timerfill"></i></div>
    <div class="timetxt" id="timetxt">15 s</div>
    <div class="progress"><i id="bar"></i></div>
    <div class="qcount" id="streakTxt"></div>
    <div class="question" id="qText">…</div>
    <div class="answers" id="answers"></div>
    <div class="explain" id="explain"></div>
    <div class="next"><button class="btn green" id="nextBtn">Suivant →</button></div>
  </section>

  <section id="result" class="card result hide">
    <div class="medal" id="medal">🏆</div>
    <div class="bigscore"><span id="finalScore">0</span><small> pts</small></div>
    <div class="verdict" id="verdict">Bravo !</div>
    <div class="statline">
      <div class="stat" id="stCorrect">0/0<span>bonnes</span></div>
      <div class="stat" id="stTime">0s<span>temps moyen</span></div>
      <div class="stat" id="stBonus">0<span>bonus vitesse</span></div>
    </div>
    <div class="pseudo" id="pseudoBox">
      <label for="pseudoIn">🏅 Entre ton pseudo pour le classement</label>
      <input id="pseudoIn" maxlength="14" placeholder="Ton pseudo" autocomplete="off">
      <button class="btn green small" id="saveScoreBtn">Enregistrer mon score</button>
    </div>
    <div class="savedmsg hide" id="savedMsg"></div>
    <button class="btn" id="showLbBtn">🏆 Voir le classement</button>
    <button class="btn green" id="againBtn">🔁 Rejouer</button>
    <button class="btn ghost" id="homeBtn">🏠 Accueil</button>
  </section>

  <section id="leaderboard" class="card hide">
    <span class="logo">🏆 Top 20</span>
    <h1>Classement</h1>
    <div class="sub">Meilleurs scores</div>
    <div class="lb" id="lbList"></div>
    <div class="lbscope" id="lbScope"></div>
    <button class="btn green" id="lbAgainBtn">🔁 Nouvelle partie</button>
    <button class="btn ghost" id="lbHomeBtn">🏠 Accueil</button>
  </section>
</div>
<script>
const META={hist:{label:"Histoire-Géo-EMC",color:"#2563eb"},fr:{label:"Français",color:"#db2777"},math:{label:"Mathématiques",color:"#059669"},sci:{label:"Sciences",color:"#d97706"}};

function renderCountdowns(){
  const now=new Date();
  $("#cdYear").textContent="Session 2026";
  const wrap=$("#countdowns");wrap.innerHTML="";
  EXAMS.forEach(ex=>{
    const target=new Date(ex.date);
    const diffMs=target-now;
    const days=Math.ceil(diffMs/(1000*60*60*24));
    const row=document.createElement("div");
    row.className="cd "+ex.key+(diffMs<0?" done":"");
    let daysHtml;
    if(diffMs<0){daysHtml='<div class="days">✓<small>passé</small></div>';}
    else if(days===0){daysHtml='<div class="days">Auj.<small>jour J</small></div>';}
    else{daysHtml='<div class="days">'+days+'<small>'+(days>1?"jours":"jour")+'</small></div>';}
    row.innerHTML='<span class="emo">'+ex.emo+'</span><div class="info"><div class="nm">'+ex.nm+'</div><div class="dt">'+ex.dlabel+'</div></div>'+daysHtml;
    wrap.appendChild(row);
  });
}

document.querySelectorAll(".subj").forEach(b=>{

  b.querySelector(".cnt").textContent=BANK[k].length+" questions";
  b.addEventListener("click",()=>{
    state.subjects[k]=!state.subjects[k];
    b.classList.toggle("off",!state.subjects[k]);
    if(!Object.values(state.subjects).some(Boolean)){state.subjects[k]=true;b.classList.remove("off");}
  });
});
$("#lenSeg").addEventListener("click",e=>{
  const btn=e.target.closest("button");if(!btn)return;
  document.querySelectorAll("#lenSeg button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");state.len=parseInt(btn.dataset.len,10);
});
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function buildQueue(){
  let pool=[];
  Object.keys(state.subjects).forEach(k=>{if(state.subjects[k])BANK[k].forEach((q,idx)=>pool.push({...q,subj:k,uid:k+idx}));});
  pool=shuffle(pool);
  pool=pool.map(q=>{const order=shuffle(q.a.map((_,i)=>i));return{...q,a:order.map(i=>q.a[i]),correct:order.indexOf(q.correct)};});
  const n=state.len===0?pool.length:Math.min(state.len,pool.length);
  state.queue=pool.slice(0,n);
}
function startGame(){
  buildQueue();
  Object.assign(state,{i:0,score:0,correctCount:0,bonusTotal:0,timeTotal:0,streak:0,log:[],lastPerf:null});
  homeEl.classList.add("hide");resEl.classList.add("hide");lbEl.classList.add("hide");
  gameEl.classList.remove("hide");gameEl.classList.add("fade");
  renderQuestion();
}

/* ---------- MINUTEUR ---------- */
function stopTimer(){if(state.tInt){clearInterval(state.tInt);state.tInt=null;}}
function startTimer(){
  stopTimer();
  state.tLeft=QUESTION_TIME;state.qStart=Date.now();
  updateTimerUI();
  state.tInt=setInterval(()=>{
    state.tLeft--;
    updateTimerUI();
    if(state.tLeft<=0){stopTimer();timeOut();}
  },1000);
}
function updateTimerUI(){
  const pct=Math.max(0,state.tLeft/QUESTION_TIME*100);
  $("#timerfill").style.width=pct+"%";
  const bar=$("#timerbar");bar.classList.toggle("warn",state.tLeft<=7);bar.classList.toggle("crit",state.tLeft<=3);
  const t=$("#timetxt");
  if(state.tLeft<=3&&state.tLeft>0)t.innerHTML="<b>"+state.tLeft+" s</b>";
  else t.textContent=Math.max(0,state.tLeft)+" s";
}
function timeOut(){
  if(state.answered)return;
  state.answered=true;
  const q=state.queue[state.i];
  const all=[...document.querySelectorAll(".ans")];
  all.forEach(a=>a.classList.add("locked"));
  all[q.correct].classList.add("correct");
  all.forEach((a,i)=>{if(i!==q.correct)a.classList.add("dim")});
  state.streak=0;state.timeTotal+=QUESTION_TIME;
  const ex=$("#explain");
  ex.innerHTML="<b>⏰ Temps écoulé !</b> "+q.exp;
  ex.classList.add("show");
  $(".next").classList.add("show");
  state.log.push({q:q.q,good:q.a[q.correct],correct:false});
}

/* ---------- QUESTIONS ---------- */
function renderQuestion(){
  state.answered=false;
  const q=state.queue[state.i];const meta=META[q.subj];
  $("#qIndex").textContent=(state.i+1)+" / "+state.queue.length;
  const tag=$("#qSubject");tag.textContent=meta.label;tag.style.background=meta.color;
  $("#scorePill").textContent="⭐ "+state.score;
  $("#bar").style.width=((state.i)/state.queue.length*100)+"%";
  $("#streakTxt").textContent=state.streak>=3?("🔥 Série de "+state.streak+" !"):"";
  $("#qText").textContent=q.q;
  $("#explain").className="explain";$("#explain").innerHTML="";
  $(".next").className="next";
  const keys=["A","B","C","D"];
  const wrap=$("#answers");wrap.innerHTML="";
  q.a.forEach((t,idx)=>{
    const b=document.createElement("button");b.className="ans";
    b.innerHTML='<span class="key">'+keys[idx]+'</span><span>'+t+'</span>';
    b.addEventListener("click",()=>choose(idx,b));
    wrap.appendChild(b);
  });
  startTimer();
}
function choose(idx,btn){
  if(state.answered)return;state.answered=true;
  stopTimer();
  const elapsed=(Date.now()-state.qStart)/1000;
  const secLeft=Math.max(0,QUESTION_TIME-elapsed);
  state.timeTotal+=Math.min(QUESTION_TIME,elapsed);
  const q=state.queue[state.i];const all=[...document.querySelectorAll(".ans")];
  all.forEach(a=>a.classList.add("locked"));
  const correct=idx===q.correct;
  let gained=0,bonus=0;
  if(correct){
    bonus=Math.round(secLeft*SPEED_PTS);
    gained=BASE_PTS+bonus;
    state.score+=gained;state.correctCount++;state.bonusTotal+=bonus;state.streak++;
    btn.classList.add("correct");
    all.forEach((a,i)=>{if(i!==idx)a.classList.add("dim")});
    burst();
  }else{
    state.streak=0;
    btn.classList.add("wrong");
    all[q.correct].classList.add("correct");
    all.forEach((a,i)=>{if(i!==idx&&i!==q.correct)a.classList.add("dim")});
  }
  $("#scorePill").textContent="⭐ "+state.score;
  const ex=$("#explain");
  ex.innerHTML=(correct?("<b>✅ +"+gained+" pts"+(bonus>0?" (dont +"+bonus+" vitesse)":"")+"</b> "):"<b>❌ Pas tout à fait.</b> ")+q.exp;
  ex.classList.add("show");
  $(".next").classList.add("show");
  state.log.push({q:q.q,good:q.a[q.correct],correct:correct});
}
$("#startBtn").addEventListener("click",startGame);
$("#nextBtn").addEventListener("click",()=>{
  state.i++;
  if(state.i>=state.queue.length)showResult();
  else{renderQuestion();gameEl.classList.remove("fade");void gameEl.offsetWidth;gameEl.classList.add("fade");}
});

/* ---------- RÉSULTAT ---------- */
function showResult(){
  stopTimer();
  gameEl.classList.add("hide");resEl.classList.remove("hide");resEl.classList.add("fade");
  const total=state.queue.length,pct=Math.round(state.correctCount/total*100);
  const avgTime=total? (state.timeTotal/total):0;
  $("#finalScore").textContent=state.score;
  $("#stCorrect").innerHTML=state.correctCount+"/"+total+"<span>bonnes</span>";
  $("#stTime").innerHTML=avgTime.toFixed(1)+"s<span>temps moyen</span>";
  $("#stBonus").innerHTML="+"+state.bonusTotal+"<span>bonus vitesse</span>";
  let medal,verdict,msg;
  if(pct>=90){medal="🏆";verdict="Champion du Brevet !";msg="Excellent, tu maîtrises ! 🌟";bigBurst();}
  else if(pct>=70){medal="🥇";verdict="Très bien !";msg="Solide ! Encore un effort sur les ratés.";bigBurst();}
  else if(pct>=50){medal="🥈";verdict="Bon travail !";msg="Tu progresses, continue !";}
  else{medal="📚";verdict="Continue à réviser !";msg="L'entraînement paie, relance un quiz !";}
  $("#medal").textContent=medal;$("#verdict").textContent=verdict;$("#resMsg")&&($("#resMsg").textContent=msg);
  // préparer la perf pour le classement
  const subjKeys=Object.keys(state.subjects).filter(k=>state.subjects[k]);
  state.lastPerf={score:state.score,correct:state.correctCount,total:total,
    avgTime:Math.round(avgTime*10)/10,bonus:state.bonusTotal,
    subjects:subjKeys.length===4?"Toutes":subjKeys.map(k=>META[k].label).join(", "),
    ts:Date.now()};
  // reset UI pseudo
  $("#pseudoBox").classList.remove("hide");
  $("#savedMsg").classList.add("hide");
  const saved=loadPseudo();if(saved)$("#pseudoIn").value=saved;
}
$("#againBtn").addEventListener("click",startGame);
$("#homeBtn").addEventListener("click",()=>{resEl.classList.add("hide");homeEl.classList.remove("hide");homeEl.classList.add("fade");renderCountdowns();});

/* ---------- CLASSEMENT (stockage partagé avec repli local) ---------- */
const LB_KEY="brevet_leaderboard_v1";
const hasShared=(typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function");
let localLB=[]; // repli si pas de stockage partagé
function loadPseudo(){try{return (window.__pseudo)||"";}catch(e){return"";}}
function savePseudoMem(p){window.__pseudo=p;}

async function getLeaderboard(){
  if(hasShared){
    try{const r=await window.storage.get(LB_KEY,true);return r&&r.value?JSON.parse(r.value):[];}
    catch(e){return [];}
  }
  return localLB.slice();
}
async function setLeaderboard(list){
  if(hasShared){
    try{await window.storage.set(LB_KEY,JSON.stringify(list),true);}catch(e){}
  }else{localLB=list.slice();}
}
async function submitScore(pseudo){
  const perf=state.lastPerf;if(!perf)return;
  let list=await getLeaderboard();
  const entry={name:pseudo.slice(0,14),score:perf.score,correct:perf.correct,total:perf.total,
    avgTime:perf.avgTime,subjects:perf.subjects,ts:perf.ts};
  list.push(entry);
  // tri : score décroissant, puis temps moyen croissant
  list.sort((a,b)=> b.score-a.score || a.avgTime-b.avgTime);
  list=list.slice(0,20);
  await setLeaderboard(list);
  return {list,entry};
}
$("#saveScoreBtn").addEventListener("click",async()=>{
  const p=($("#pseudoIn").value||"").trim();
  if(!p){$("#pseudoIn").focus();$("#pseudoIn").style.borderColor="#ef4444";return;}
  savePseudoMem(p);
  $("#saveScoreBtn").disabled=true;$("#saveScoreBtn").textContent="…";
  const res=await submitScore(p);
  $("#pseudoBox").classList.add("hide");
  const msg=$("#savedMsg");msg.classList.remove("hide");
  const rank=res.list.findIndex(e=>e.ts===res.entry.ts&&e.name===res.entry.name);
  msg.textContent=rank>=0&&rank<20?("🎉 Score enregistré — "+(rank+1)+"ᵉ place !"):"Score enregistré !";
  $("#saveScoreBtn").disabled=false;$("#saveScoreBtn").textContent="Enregistrer mon score";
  window.__lastEntryTs=res.entry.ts;
});
async function renderLeaderboard(){
  const list=await getLeaderboard();
  const wrap=$("#lbList");wrap.innerHTML="";
  if(!list.length){wrap.innerHTML='<div class="lbempty">Aucun score pour l\'instant.<br>Sois le premier à jouer ! 🚀</div>';}
  else{
    list.forEach((e,i)=>{
      const row=document.createElement("div");
      row.className="lbrow"+(i===0?" top1":i===1?" top2":i===2?" top3":"")+(window.__lastEntryTs&&e.ts===window.__lastEntryTs?" me":"");
      const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1);
      row.innerHTML='<span class="rk">'+medal+'</span><span class="nm">'+e.name+'</span><span class="pts">'+e.score+'</span><span class="tm">'+e.avgTime+'s</span>';
      wrap.appendChild(row);
    });
  }
  $("#lbScope").textContent=hasShared?"Classement partagé entre joueurs":"Classement local (cet appareil)";
}
function openLeaderboard(){
  resEl.classList.add("hide");homeEl.classList.add("hide");
  lbEl.classList.remove("hide");lbEl.classList.add("fade");
  renderLeaderboard();
}
$("#showLbBtn").addEventListener("click",openLeaderboard);
$("#seeLbBtn").addEventListener("click",openLeaderboard);
$("#lbAgainBtn").addEventListener("click",startGame);
$("#lbHomeBtn").addEventListener("click",()=>{lbEl.classList.add("hide");homeEl.classList.remove("hide");homeEl.classList.add("fade");renderCountdowns();});

/* ---------- CONFETTIS ---------- */
function piece(x,big){
  const c=document.createElement("div");c.className="confetti";
  const colors=["#ec4899","#f59e0b","#10b981","#3b82f6","#fde047","#a855f7"];
  c.style.background=colors[Math.floor(Math.random()*colors.length)];
  c.style.left=x+"px";c.style.top="-20px";
  const dx=(Math.random()-.5)*200,fall=(big?600:380)+Math.random()*200,rot=Math.random()*720;
  document.body.appendChild(c);
  c.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:"translate("+dx+"px,"+fall+"px) rotate("+rot+"deg)",opacity:0}],{duration:big?1400:900,easing:"cubic-bezier(.3,.7,.4,1)"}).onfinish=()=>c.remove();
}
function burst(){const x=window.innerWidth/2;for(let i=0;i<14;i++)piece(x+(Math.random()-.5)*120,false);}
function bigBurst(){for(let i=0;i<60;i++)setTimeout(()=>piece(Math.random()*window.innerWidth,true),i*20);}

/* ---------- INIT ---------- */
renderCountdowns();
setInterval(renderCountdowns,60*60*1000); // rafraîchir chaque heure
</script>
